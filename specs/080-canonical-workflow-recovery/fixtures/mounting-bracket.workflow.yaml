# Wright recovery syntax treatment: comments are not round-trip preserved by this parser.
document_kind: workflow-ir
schema_version: 2.0.0-recovery.1
workflow_id: workflow.mounting-bracket
revision: 2
parent_revision: 1
semantic_sha256: null
metadata:
  title: Mounting bracket development
  purpose: Turn bracket requirements into a reviewed manufacturable STEP package.
  engineering_domain: mechanical.design
  authorship: human_with_ai_proposal
phases:
  - id: phase.define
    name: Define
    purpose:
      Combine design intent, reference images, and company context into a reviewed design specification,
      then create the CAD model.
    order: 0
    block_ids:
      - block.reference-images
      - block.design-intent
      - block.company-context
      - block.create-design-specification
      - block.generate-geometry
  - id: phase.verify
    name: Verify
    purpose: Check manufacturability and approve the design.
    order: 1
    block_ids:
      - block.check-manufacturability
      - block.review-design
  - id: phase.deliver
    name: Deliver
    purpose: Export and package the approved design.
    order: 2
    block_ids:
      - block.export-step
      - block.release-package
blocks:
  - id: block.reference-images
    kind: work
    title: Reference images
    purpose: Add sketches, photographs, or marked-up images that show the intended bracket and interfaces.
    phase_id: phase.define
    execution_kind: human
    instructions:
      Add one or more JPG or PNG images and identify any dimensions or interfaces that must
      be preserved.
    configuration:
      accepted_formats: JPG, PNG
    input_port_ids: []
    output_port_ids:
      - port.reference-images-out
    binding_id: null
    component_ref: null
  - id: block.design-intent
    kind: work
    title: Design intent
    purpose:
      Describe how the bracket will be used, its loads, interfaces, constraints, and success criteria
      in text or a common document.
    phase_id: phase.define
    execution_kind: human
    instructions:
      Enter design intent as text or add a common document. Include use, loads, interfaces,
      constraints, units, and known material requirements.
    configuration:
      input_mode: text-or-document
      units: mm
    input_port_ids: []
    output_port_ids:
      - port.design-intent-out
    binding_id: null
    component_ref: null
  - id: block.company-context
    kind: work
    title: Company standards and context
    purpose: Bring in approved standards, preferred materials and processes, and relevant past designs.
    phase_id: phase.define
    execution_kind: deterministic
    instructions:
      Retrieve the company standards and prior-design guidance relevant to brackets, material
      selection, tolerancing, and manufacturing.
    configuration:
      source: approved-company-library
    input_port_ids: []
    output_port_ids:
      - port.company-context-out
    binding_id: binding.company-context
    component_ref: null
  - id: block.create-design-specification
    kind: approval
    title: Create and review design specification
    purpose:
      Combine the three input sources into an editable, reviewable source of truth before CAD work
      begins.
    phase_id: phase.define
    execution_kind: ai_capable
    instructions:
      Draft a concise engineering design specification from the design intent, reference images,
      and company context. Separate supplied facts from assumptions, flag conflicts and missing information,
      and require engineer review before release to CAD.
    configuration:
      review_status: needs-review
    input_port_ids:
      - port.design-intent-in
      - port.reference-images-in
      - port.company-context-in
    output_port_ids:
      - port.design-specification-out
    binding_id: binding.create-design-specification
    component_ref: null
  - id: block.generate-geometry
    kind: work
    title: Create bracket CAD model
    purpose: Create a parametric L-bracket from the reviewed design specification.
    phase_id: phase.define
    execution_kind: deterministic
    instructions: Create the bracket with two mounting holes and one slotted interface.
    configuration:
      thickness_mm: 6
      inside_radius_mm: 4
    input_port_ids:
      - port.design-specification-in
    output_port_ids:
      - port.geometry-out
    binding_id: binding.generate-geometry
    component_ref: null
  - id: block.check-manufacturability
    kind: work
    title: Run manufacturing checks
    purpose: Check bend radius, edge distance, thickness, and tool access.
    phase_id: phase.verify
    execution_kind: ai_capable
    instructions:
      Check bend radius, edge distance, thickness, and tool access. For each issue, cite the
      CAD feature and material property that triggered it.
    configuration:
      process: machined-and-bent
      minimum_edge_ratio: 1.5
    input_port_ids:
      - port.geometry-check-in
      - port.design-specification-check-in
    output_port_ids:
      - port.report-out
    binding_id: binding.check-manufacturability
    component_ref: null
  - id: block.review-design
    kind: component
    title: Review CAD model for approval
    purpose: Approve the CAD model and manufacturing report or return the design for revision.
    phase_id: phase.verify
    execution_kind: human
    instructions:
      Approve only when the reviewed design specification, CAD model, and manufacturing check
      report agree and every issue has a recorded resolution.
    configuration:
      required_role: design-reviewer
    input_port_ids:
      - port.design-specification-review-in
      - port.geometry-review-in
      - port.report-in
    output_port_ids:
      - port.approved-geometry-out
    binding_id: null
    component_ref:
      component_id: component.review-cell
      version_range: ^1.0.0
  - id: block.export-step
    kind: work
    title: Export approved STEP file
    purpose: Export the approved bracket CAD model as a neutral STEP file.
    phase_id: phase.deliver
    execution_kind: deterministic
    instructions: Export STEP AP242 in millimetres from the approved CAD model and record its source revision.
    configuration:
      format: STEP AP242
      overwrite: false
    input_port_ids:
      - port.approved-geometry-in
    output_port_ids:
      - port.step-out
    binding_id: binding.export-step
    component_ref: null
  - id: block.release-package
    kind: work
    title: Create design handoff package
    purpose: Place the STEP file and manufacturing report in one local handoff package.
    phase_id: phase.deliver
    execution_kind: deterministic
    instructions:
      Create a local ZIP containing the approved STEP file and manufacturing report. Do not
      publish or send it.
    configuration:
      classification: internal
      publish: false
    input_port_ids:
      - port.step-in
      - port.report-package-in
    output_port_ids:
      - port.package-out
    binding_id: binding.release-package
    component_ref: null
ports:
  - id: port.reference-images-out
    owner_block_id: block.reference-images
    direction: output
    name: Reference images
    type_id: type.image.reference-set
    required: true
    cardinality: many
    artifact_contract_id: artifact.reference-images
    description: Sketches, photographs, or marked-up JPG and PNG images supplied by the engineer.
  - id: port.design-intent-out
    owner_block_id: block.design-intent
    direction: output
    name: Design intent
    type_id: type.design.intent
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-intent
    description:
      Engineer-entered text or a common document describing use, loads, interfaces, constraints,
      units, and known material requirements.
  - id: port.company-context-out
    owner_block_id: block.company-context
    direction: output
    name: Company standards and context
    type_id: type.context.company
    required: true
    cardinality: one
    artifact_contract_id: artifact.company-context
    description: Approved standards, preferred practices, and relevant prior-design guidance.
  - id: port.design-intent-in
    owner_block_id: block.create-design-specification
    direction: input
    name: Design intent
    type_id: type.design.intent
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-intent
    description: The engineer's text or document describing what the bracket must do.
  - id: port.reference-images-in
    owner_block_id: block.create-design-specification
    direction: input
    name: Reference images
    type_id: type.image.reference-set
    required: true
    cardinality: many
    artifact_contract_id: artifact.reference-images
    description: Visual references used to clarify shape, interfaces, and constraints.
  - id: port.company-context-in
    owner_block_id: block.create-design-specification
    direction: input
    name: Company standards and context
    type_id: type.context.company
    required: true
    cardinality: one
    artifact_contract_id: artifact.company-context
    description: Approved company rules and reusable design knowledge.
  - id: port.design-specification-out
    owner_block_id: block.create-design-specification
    direction: output
    name: Reviewed design specification
    type_id: type.design.specification
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-specification
    description:
      Editable source of truth that separates supplied facts, assumptions, decisions, and unresolved
      questions.
  - id: port.design-specification-in
    owner_block_id: block.generate-geometry
    direction: input
    name: Reviewed design specification
    type_id: type.design.specification
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-specification
    description: The reviewed source of truth used to create the bracket CAD model.
  - id: port.geometry-out
    owner_block_id: block.generate-geometry
    direction: output
    name: Bracket CAD model
    type_id: type.geometry.brep
    required: true
    cardinality: one
    artifact_contract_id: artifact.geometry
    description: Parametric bracket CAD model.
  - id: port.geometry-check-in
    owner_block_id: block.check-manufacturability
    direction: input
    name: Bracket CAD model
    type_id: type.geometry.brep
    required: true
    cardinality: one
    artifact_contract_id: artifact.geometry
    description: CAD model to check for manufacturing issues.
  - id: port.design-specification-check-in
    owner_block_id: block.check-manufacturability
    direction: input
    name: Reviewed design specification
    type_id: type.design.specification
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-specification
    description:
      Approved dimensions, material, process, tolerances, and acceptance criteria used by the
      manufacturing checks.
  - id: port.report-out
    owner_block_id: block.check-manufacturability
    direction: output
    name: Manufacturing check report
    type_id: type.report.manufacturability
    required: true
    cardinality: one
    artifact_contract_id: artifact.manufacturability-report
    description: Manufacturing issues, supporting evidence, and recommended corrections.
  - id: port.design-specification-review-in
    owner_block_id: block.review-design
    direction: input
    name: Reviewed design specification
    type_id: type.design.specification
    required: true
    cardinality: one
    artifact_contract_id: artifact.design-specification
    description: Accepted design criteria used to judge the CAD model and manufacturing report.
  - id: port.geometry-review-in
    owner_block_id: block.review-design
    direction: input
    name: Bracket CAD model
    type_id: type.geometry.brep
    required: true
    cardinality: one
    artifact_contract_id: artifact.geometry
    description: CAD model presented for design approval.
  - id: port.report-in
    owner_block_id: block.review-design
    direction: input
    name: Manufacturing check report
    type_id: type.report.manufacturability
    required: true
    cardinality: one
    artifact_contract_id: artifact.manufacturability-report
    description: Manufacturing evidence presented for design approval.
  - id: port.approved-geometry-out
    owner_block_id: block.review-design
    direction: output
    name: Approved CAD model
    type_id: type.geometry.approved
    required: true
    cardinality: one
    artifact_contract_id: artifact.approved-geometry
    description: Exact CAD model revision approved by design review.
  - id: port.approved-geometry-in
    owner_block_id: block.export-step
    direction: input
    name: Approved CAD model
    type_id: type.geometry.approved
    required: true
    cardinality: one
    artifact_contract_id: artifact.approved-geometry
    description: Approved CAD model used for the STEP export.
  - id: port.step-out
    owner_block_id: block.export-step
    direction: output
    name: STEP AP242 file
    type_id: type.file.step
    required: true
    cardinality: one
    artifact_contract_id: artifact.step
    description: Neutral bracket CAD file for downstream use.
  - id: port.step-in
    owner_block_id: block.release-package
    direction: input
    name: STEP AP242 file
    type_id: type.file.step
    required: true
    cardinality: one
    artifact_contract_id: artifact.step
    description: Approved STEP file to include in the handoff package.
  - id: port.report-package-in
    owner_block_id: block.release-package
    direction: input
    name: Manufacturing check report
    type_id: type.report.manufacturability
    required: true
    cardinality: one
    artifact_contract_id: artifact.manufacturability-report
    description: Manufacturing report to include in the handoff package.
  - id: port.package-out
    owner_block_id: block.release-package
    direction: output
    name: Design handoff package
    type_id: type.package.review
    required: true
    cardinality: one
    artifact_contract_id: artifact.release-package
    description: Local ZIP containing the approved STEP file and manufacturing report.
