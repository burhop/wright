[project]
name = "hermes-plugin-wright"
version = "1.2.0"
description = "Thin Git-installed Hermes adapter for the Wright runtime"
authors = [{name = "Wright Project", email = "wright@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.entry-points."hermes_agent.plugins"]
wright = "hermes_plugin_wright"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "__init__.py" = "hermes_plugin_wright/__init__.py", "plugin.yaml" = "hermes_plugin_wright/plugin.yaml", "bootstrap.py" = "hermes_plugin_wright/bootstrap.py", "commands.py" = "hermes_plugin_wright/commands.py" }


