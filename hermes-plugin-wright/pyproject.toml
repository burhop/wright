[project]
name = "hermes-plugin-wright"
version = "1.1.0"
description = "Legacy migration delegate to the public Wright Hermes application"
authors = [{name = "Wright Project", email = "wright@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "wright-engineering==0.1.5",
]

[project.entry-points."hermes_agent.plugins"]
wright = "hermes_plugin_wright"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "__init__.py" = "hermes_plugin_wright/__init__.py", "plugin.yaml" = "hermes_plugin_wright/plugin.yaml", "bridge.py" = "hermes_plugin_wright/bridge.py", "commands.py" = "hermes_plugin_wright/commands.py" }


