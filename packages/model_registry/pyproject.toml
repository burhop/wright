[project]
name = "wright-model-registry"
version = "0.1.0"
description = "Safe local engineering model catalog, lifecycle, runtime, and gateway contracts for Wright"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Wright Project", email = "wright@example.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "packaging>=24,<27",
    "pydantic>=2.7,<3",
    "psutil>=6,<8",
    "PyYAML>=6,<7",
    "wright-core>=0.1.0,<0.2.0",
    "wright-tool-registry>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
neuralfoil = [
    "numpy>=1.26,<3",
]

[tool.uv.sources]
wright-core = { workspace = true }
wright-tool-registry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_registry"]

[tool.hatch.build.targets.sdist]
include = ["src/model_registry", "README.md", "pyproject.toml"]
