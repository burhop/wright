[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wright-workflow"
version = "0.1.0.dev1"
description = "Native Wright workflow format, parser and reference executor"
readme = "FORMAT.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/wright_workflow"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/FORMAT.md", "/LICENSE", "/pyproject.toml"]
