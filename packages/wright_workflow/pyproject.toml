[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wright-workflow"
version = "0.1.0.dev2"
description = "Native Wright workflow format, parser and reference executor"
readme = "FORMAT.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5", "mcp>=1.30,<2"]

[project.scripts]
wright-workflow = "wright_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wright_workflow"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["/src/wright_workflow/**/*.py", "/src/wright_workflow/schemas/*.json", "/tests/**/*.py", "/examples", "/FORMAT.md", "/LICENSE", "/pyproject.toml"]
