[project]
name = "wright-workspace-service"
version = "0.1.0"
description = "Workspace lifecycle and Workspace Surfaces application services for Wright"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Wright Project", email = "wright@example.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "anyio>=4,<5",
    "httpx>=0.27,<1",
    "pydantic>=2.7",
    "psutil>=6,<8",
    "PyYAML>=6,<7",
    "wright-core>=0.1.0,<0.2.0",
    "wright-agent-adapters>=0.1.0,<0.2.0",
    "wright-data-vault>=0.1.0,<0.2.0",
    "wright-model-registry>=0.1.0,<0.2.0",
    "wright-tool-registry>=0.1.0,<0.2.0",
    "pypdfium2>=5,<6",
    "pillow>=13,<14",
]

[project.urls]
Homepage = "https://github.com/burhop/wright"
Source = "https://github.com/burhop/wright/tree/dev/packages/workspace_service"
Issues = "https://github.com/burhop/wright/issues"
Documentation = "https://burhop.github.io/wright/"
Releases = "https://github.com/burhop/wright/releases"

[tool.uv.sources]
wright-core = { workspace = true }
wright-agent-adapters = { workspace = true }
wright-data-vault = { workspace = true }
wright-model-registry = { workspace = true }
wright-tool-registry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_service"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The private service's sdist must also be rebuildable without sibling packages.
[tool.hatch.build.targets.sdist.force-include]
"../../examples/process-interfaces/definition.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/definition.py"
"../../examples/process-interfaces/printed-replacement-part/prepare.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/prepare.py"
"../../examples/process-interfaces/printed-replacement-part/provider_inputs.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/provider_inputs.py"
"../../examples/process-interfaces/printed-replacement-part/retained_source.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/retained_source.py"
"../../examples/process-interfaces/printed-replacement-part/repair_gate.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/repair_gate.py"
"../../examples/process-interfaces/printed-replacement-part/native_inspection.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/native_inspection.py"
"../../examples/process-interfaces/printed-replacement-part/orientation_stages.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/orientation_stages.py"
"../../examples/process-interfaces/printed-replacement-part/scenario_inputs.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/scenario_inputs.py"
"../../examples/process-interfaces/printed-replacement-part/orca_binding.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/orca_binding.py"
"../../examples/process-interfaces/printed-replacement-part/orca_stages.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/orca_stages.py"
"../../examples/process-interfaces/printed-replacement-part/run_disclosure.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/run_disclosure.py"
"../../examples/process-interfaces/printed-replacement-part/orca-preparation.py" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/orca-preparation.py"
"../../examples/process-interfaces/printed-replacement-part/run-disclosure-template.md" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/run-disclosure-template.md"
"../../examples/process-interfaces/printed-replacement-part/scenarios/printed-replacement-part-02.json" = "src/workspace_service/engineering_workflow_templates/setup_resources/printed-replacement-part/scenarios/printed-replacement-part-02.json"
