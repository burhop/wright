  - id: robot-tracking-diagnosis
    version: 1.0.0
    title: Robot Tracking Diagnosis
    summary: Analyze a recorded ROS 2 run, align planned and observed paths, and report evidence-linked tracking error without overclaiming cause.
    discipline: Robotics diagnostics
    source: templates/robot-tracking-diagnosis.workflow.wflow
    layout: layouts/robot-tracking-diagnosis.json
    preview: {asset: previews/robot-tracking-diagnosis.svg, alt: "Planned and observed robot paths with a time-aligned error chart."}
    provided_inputs: []
    requested_inputs: [{name: "Redistributable ROS 2 bag and annotated event", kind: recorded_data}]
    expected_outputs: [{name: "Trajectory overlay", format: SVG}, {name: "Tracking metrics and timeline", format: JSON}]
    capabilities: [{operation: rosbag_retrieval, qualification: partial}, {operation: time_alignment_and_metrics, qualification: required}]
    external_effects: []
    acceptance_profile: robot-tracking-diagnosis/v1
    definition_status: reviewed
    rights: {fixture: user_supplied, redistribution: conditional, social_capture: requires_review}
    readiness: reference
    readiness_facts: [{code: rosbag-retrieval, label: "Known-message retrieval qualified", satisfied: true}, {code: analysis-qualified, label: "Numeric alignment and metrics qualified", satisfied: false}]
    blocking_reasons: ["Numeric messages, independent alignment, plotting, and recovery behavior require qualification."]
  - id: heat-spreader-sizing
    version: 1.0.0
    title: Conduction Heat-Spreader Sizing
    summary: Size a conduction plate by comparing a numerical temperature field with an analytical baseline, heat balance, and mesh sensitivity.
    discipline: Thermal analysis
    source: templates/heat-spreader-sizing.workflow.wflow
    layout: layouts/heat-spreader-sizing.json
    preview: {asset: previews/heat-spreader-sizing.svg, alt: "Two heat-spreader temperature maps and a maximum-temperature comparison."}
    provided_inputs: []
    requested_inputs: [{name: "Geometry, conductivity, heat input, boundary conditions, and limit", kind: engineering_requirements}]
    expected_outputs: [{name: "Plate geometry", format: STEP}, {name: "Temperature field and balance", format: solver_result}, {name: "Sizing decision", format: JSON}]
    capabilities: [{operation: brep_cad, qualification: partial}, {operation: conduction_solver, qualification: required}]
    external_effects: [solver_execution]
    acceptance_profile: conduction-heat-spreader/v1
    definition_status: reviewed
    rights: {fixture: user_supplied, redistribution: conditional, social_capture: requires_review}
    readiness: reference
    readiness_facts: [{code: oasis-baseline, label: "OASiS unit-square Poisson path qualified", satisfied: true}, {code: dimensional-thermal-qualified, label: "Dimensional thermal handoff qualified", satisfied: false}]
    blocking_reasons: ["The dimensional thermal problem and CAD handoff require qualification."]
