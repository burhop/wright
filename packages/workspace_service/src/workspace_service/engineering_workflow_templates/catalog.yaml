    provided_inputs: []
    requested_inputs: [{name: "Approved schematic, datasheets, pinout, and board envelope", kind: engineering_requirements}]
    expected_outputs: [{name: "Editable KiCad design", format: KiCad}, {name: "BOM and fabrication files", format: Gerber}]
