catalog_version: 1.0.0
templates:
  - id: printed-replacement-part
    version: 1.0.0
    title: 3D Printed Replacement Part
    summary: Create, repair, support, slice, verify, and authorize transfer of a dimensioned replacement part from an original image.
    discipline: Additive manufacturing
    source: templates/printed-replacement-part.workflow.wflow
    layout: layouts/printed-replacement-part.json
    preview: {asset: previews/printed-replacement-part.svg, alt: "A source photo progressing through a measured mesh and sliced replacement part."}
    provided_inputs: [{name: "Demo knob photograph", kind: image, attribution: "Wright project generated fixture"}]
    requested_inputs: [{name: "Reference dimension", kind: quantity, units: mm}, {name: "Bambu P1S and profiles", kind: configured_destination}]
    expected_outputs: [{name: "Measured repaired mesh", format: STL}, {name: "Support-bearing slice package", format: 3MF}, {name: "Transfer receipt", format: JSON}]
    capabilities: [{operation: image_to_mesh, qualification: required}, {operation: mesh_repair, qualification: required}, {operation: slice_with_supports, qualification: required}, {operation: printer_transfer, qualification: required}]
    external_effects: [printer_transfer]
    acceptance_profile: additive-replacement-part/v1
    definition_status: reviewed
    rights: {fixture: project_created, redistribution: allowed, social_capture: allowed}
    readiness: setup_required
    readiness_facts: [{code: definition-reviewed, label: "Starter definition reviewed", satisfied: true}, {code: adapters-qualified, label: "Image, slicer, and printer adapters qualified", satisfied: false}]
    blocking_reasons: ["Configure and qualify image-to-mesh, slicer, and Bambu P1S transfer adapters before a live run."]
  - id: raspberry-pi-enclosure
    version: 1.0.0
    title: Vented Raspberry Pi Enclosure
    summary: Source Raspberry Pi 5 dimensions, write a design basis, create AgentCAD geometry, and compare vent designs with field-based CFD.
    discipline: Mechanical and thermal design
    source: templates/raspberry-pi-enclosure.workflow.wflow
    layout: layouts/raspberry-pi-enclosure.json
    preview: {asset: previews/raspberry-pi-enclosure.svg, alt: "A Raspberry Pi enclosure beside two airflow field comparisons."}
    provided_inputs: [{name: "Raspberry Pi 5 reference pointer", kind: manufacturer_reference, attribution: "Raspberry Pi Ltd documentation link"}]
    requested_inputs: [{name: "Board model and operating conditions", kind: engineering_requirements}]
    expected_outputs: [{name: "Sourced design document", format: Markdown}, {name: "Enclosure and fluid domain", format: STEP}, {name: "CFD comparison", format: JSON}]
    capabilities: [{operation: manufacturer_reference_retrieval, qualification: required}, {operation: agentcad_modeling, qualification: required}, {operation: cfd_solver_fields, qualification: required}]
    external_effects: [network_reference_lookup, solver_execution]
    acceptance_profile: vented-enclosure-cfd/v1
    definition_status: reviewed
    rights: {fixture: link_and_extraction_expectations, redistribution: allowed, social_capture: attributed}
    readiness: setup_required
    readiness_facts: [{code: definition-reviewed, label: "Starter definition reviewed", satisfied: true}, {code: agentcad-qualified, label: "AgentCAD qualified in Wright", satisfied: false}, {code: cfd-qualified, label: "Matching CFD path qualified", satisfied: false}]
    blocking_reasons: ["AgentCAD D001 and Foam-Agent D040 are discovery candidates and require qualification before live execution."]
  - id: sheet-metal-supplier-handoff
    version: 1.0.0
    title: Sheet-Metal Supplier Handoff
    summary: Turn image and text intent into checked sheet-metal CAD, verified exports, and a human-controlled SendCutSend quote handoff.
    discipline: Sheet-metal manufacturing
    source: templates/sheet-metal-supplier-handoff.workflow.wflow
    layout: layouts/sheet-metal-supplier-handoff.json
    preview: {asset: previews/sheet-metal-supplier-handoff.svg, alt: "A folded sheet-metal bracket, flat pattern, and supplier quote preview."}
    provided_inputs: [{name: "Bracket intent fixture", kind: image_and_text, attribution: "Wright project curated demo fixture"}]
    requested_inputs: [{name: "Approved manufacturing context", kind: engineering_requirements}, {name: "Supplier session", kind: configured_destination}]
    expected_outputs: [{name: "Native sheet-metal model", format: PSM}, {name: "Folded neutral model", format: STEP}, {name: "Verified flat pattern", format: DXF}, {name: "Supplier preview", format: JSON}]
    capabilities: [{operation: solid_edge_sheet_metal, qualification: required}, {operation: independent_design_check, qualification: required}, {operation: supplier_preview, qualification: required}]
    external_effects: [supplier_upload_preview, cart_quote_handoff]
    acceptance_profile: sendcutsend-sheet-metal/v1
    definition_status: reviewed
    rights: {fixture: project_curated, redistribution: allowed, social_capture: allowed}
    readiness: setup_required
    readiness_facts: [{code: recovered-definition, label: "Recovered approval and export sequence", satisfied: true}, {code: supplier-path-qualified, label: "Current supplier preview path qualified", satisfied: false}]
    blocking_reasons: ["A current Solid Edge and supplier-preview qualification is required; ordering and payment remain outside Wright."]
  - id: lightweight-equipment-bracket
    version: 1.0.0
    title: Lightweight Equipment Bracket
    summary: Create a load-bearing bracket, run static analysis, and compare mass while enforcing displacement and stress requirements.
    discipline: Structural mechanics
    source: templates/lightweight-equipment-bracket.workflow.wflow
    layout: layouts/lightweight-equipment-bracket.json
    preview: {asset: previews/lightweight-equipment-bracket.svg, alt: "Two bracket revisions with a stress contour and mass comparison."}
    provided_inputs: []
    requested_inputs: [{name: "Mounting geometry, load, fixtures, and material properties", kind: engineering_requirements}]
    expected_outputs: [{name: "Bracket CAD", format: STEP}, {name: "Mesh and solver deck", format: native}, {name: "Stress, displacement, and mass comparison", format: JSON}]
    capabilities: [{operation: brep_cad, qualification: required}, {operation: calculix_static_analysis, qualification: required}]
    external_effects: [solver_execution]
    acceptance_profile: structural-bracket/v1
    definition_status: reviewed
    rights: {fixture: user_supplied, redistribution: conditional, social_capture: requires_review}
    readiness: reference
    readiness_facts: [{code: workflow-authored, label: "Reference workflow authored", satisfied: true}, {code: full-chain-qualified, label: "Full CAD-to-FEA chain qualified", satisfied: false}]
    blocking_reasons: ["Bracket geometry and CalculiX D034 integration require clean-environment qualification."]
  - id: sensor-interface-pcb
    version: 1.0.0
    title: Sensor-Interface PCB
