  matlab-mcp-server:
    category: requires_login
    substatus: authentication_needed
    reason: "The SHA-pinned official binary initializes, exposes its five tools, and reaches the expected MATLAB detection boundary; licensed MATLAB is the sole unavailable execution dependency."
    reviewed_at: "2026-09-10"
    priority: high
