    tests_remaining: []
    limitations:
      - No live Windows AutoCAD operation was run because current source review closed it as an incomplete duplicate.
  freecad-mcp-contextform:
    category: abandoned
    substatus: closed
    reason: With FreeCAD installed and connected, the first modeling call hangs on invalid GUI-thread dispatch; Wright already qualifies freecad-mcp-nekanat.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Installer tests, FreeCAD connection, echo, and backend timeout reproduction
    tests_remaining: []
    limitations:
      - Preserved evidence records host-thread errors and no modeling artifact.
  freecad-mcp-proximile:
    category: abandoned
    substatus: closed
    reason: The single-commit experimental stack combines CAD mutation, arbitrary Python, Docker lifecycle control, public tunnels, and multi-GPU AI services; it is too broad and risky for Wright's dependable core while a qualified FreeCAD integration already exists.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Current source identity review
    tests_remaining: []
    limitations:
