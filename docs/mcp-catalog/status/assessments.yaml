schema_version: 1
policy_version: engineering-integrations-v2
assessments:
  autocad-mcp-u-c4n:
    category: works
    substatus: qualified
    reason: The pinned headless DXF workflow passed protocol, backend, Wright gateway, independent geometry, error, and workspace-boundary checks.
    reviewed_at: "2026-09-10"
    priority: normal
    tests_completed:
      - Pinned upstream suite and three direct Wright routes
      - DXF geometry and out-of-workspace rejection
    tests_remaining:
      - Qualify live Windows AutoCAD COM mode separately
    limitations:
      - Works applies to the qualified headless DXF fallback scope, not live AutoCAD.
  kernelcad-mcp:
    category: abandoned
    substatus: closed
    reason: Releases 0.11.2 and 0.15.0 both fail before protocol initialization because the runtime depends on a mutable GitHub package fetch that Wright's product installation policy intentionally rejects.
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - Current npm metadata and integrity review
      - Clean-container install attempts for 0.11.2 and 0.15.0
    tests_remaining: []
    limitations:
      - Reconsider only after the publisher ships every runtime dependency as an immutable registry artifact.
  rhino-mcp-easehee:
    category: works
    substatus: qualified
    reason: The pinned headless 3DM workflow passed protocol, backend, Wright gateway, independent Brep inspection, error, and reopen checks.
    reviewed_at: "2026-09-10"
    priority: normal
    tests_completed:
      - Pinned upstream suite and three direct Wright routes
      - Independent units, bounds, topology, validity, and reopen inspection
    tests_remaining:
      - Qualify live Rhino and Grasshopper separately
    limitations:
      - Works applies to the qualified headless solid 3DM fallback scope.
      - Standalone mesh volume and STL behavior remain outside the qualified scope.
  web3d-mcp:
    category: preview
    substatus: verification_incomplete
    reason: Server startup, protocol discovery, upstream tests, scene generation, validation, preview, and code generation passed; dependency advisories and the stated Node version remain unresolved.
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - Protocol initialization and discovery of 12 tools on Node 22
      - Upstream test suites and four representative tool operations
    tests_remaining:
      - Resolve or accept current dependency advisories
      - Reconcile the upstream Node 18 claim with the observed Node 22 requirement
      - Complete a scoped Wright gateway and artifact qualification
    limitations:
      - The clean-container dependency audit reported 33 vulnerabilities.
      - Startup failed on Node 18 despite the upstream Node 18+ statement.
  ansys-fluent-mcp:
    category: requires_login
    substatus: authentication_needed
    reason: "The official pinned package, MCP discovery, and safe code validation pass; a licensed Fluent solver is the only unavailable boundary, so customer exposure must remain credential-gated and unqualified for CFD results."
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - "Pinned official 0.4.0 wheel"
      - "MCP initialization and 25-tool discovery"
      - "Safe validate_code backend-independent probe"
    tests_remaining:
      - "Connect licensed Fluent 2024 R1 or newer and pass a deterministic CFD artifact and gateway qualification."
    limitations:
      - "No licensed solver, mesh, field result, export, or Wright gateway solve has been proven."
  ansys-mcp-server-community:
    category: abandoned
    substatus: closed
    reason: The community server cannot import against current MCP SDK releases and never initializes; the official PyFluent MCP is the stronger maintained Ansys path.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Startup attempts on Python 3.12 and 3.13
    tests_remaining: []
    limitations:
      - Preserved evidence ends before MCP initialization.
  autodesk-fusion-data-mcp:
    category: abandoned
    substatus: closed
    reason: The configured Autodesk API origin is not an MCP endpoint and no installable server or corrected endpoint identity was found.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Remote initialize attempt and endpoint identity review
    tests_remaining: []
    limitations:
      - Reinstatement requires a concrete Autodesk-published MCP endpoint or package.
  autodesk-fusion-desktop-mcp:
    category: abandoned
    substatus: closed
    reason: "The official product documentation is credible, but the proprietary command is unavailable outside a licensed Fusion host and no protocol, backend artifact, or Wright gateway call can be reproduced for this release."
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - "Official source/host-boundary review"
      - "Clean-runtime command-availability check"
    tests_remaining: []
    limitations:
      - "No executable server package or MCP session was available in the supported qualification environment."
      - "Re-entry condition: Re-enter after obtaining an authorized disposable Fusion host and passing protocol, model inspection/export, gateway, and cleanup checks."
  autodesk-fusion-mcp-python:
    category: abandoned
    substatus: closed
    reason: The only advertised modeling tool fails before its Autodesk request because the package uses a nonexistent httpx BasicAuth API; fusion360-mcp-server is the stronger follow-up candidate.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Source install, protocol discovery, and generate_cube failure reproduction
    tests_remaining: []
    limitations:
      - Preserved evidence contains no successful Autodesk backend operation.
  blender-mcp-harveyxiacn:
    category: abandoned
    substatus: closed
    reason: "This alternative has no current differentiated backend qualification and duplicates Wright's already qualified Blender integration, so it is excluded from the current shortlist."
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - "Current source identity and host-boundary review"
    tests_remaining: []
    limitations:
      - "No Blender artifact or Wright gateway task was executed for this implementation."
      - "Re-entry condition: Re-enter only after demonstrating a material capability absent from the qualified Blender server and passing full artifact qualification."
  cad-mcp-daobataotie:
    category: abandoned
    substatus: closed
    reason: "The source has no tests, cannot initialize without Windows COM, and overlaps the qualified AutoCAD path without evidence of a material advantage."
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - "Pinned source review"
      - "Requirements install attempt"
      - "pywin32/win32com startup boundary"
    tests_remaining: []
    limitations:
      - "No MCP initialization or CAD artifact was produced."
      - "Re-entry condition: Re-enter after a maintained Windows release passes protocol, read-only inspection, export, gateway, and comparison against the qualified AutoCAD integration."
  comsol-multiphysics-mcp-suzysa:
    category: abandoned
    substatus: closed
    reason: The test suite passes but the server imports a removed MCP SDK module and cannot initialize; the wjc9011 COMSOL candidate remains the active evaluation path.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
      - Seventy-six package tests and startup failure reproduction
    tests_remaining: []
    limitations:
      - No MCP or licensed COMSOL operation completed.
  comsol-multiphysics-mcp-wjc9011:
    category: abandoned
    substatus: closed
    reason: "The candidate has no reproducible minimal install or MCP initialization; its heavyweight ML/CUDA dependency path and bundled COMSOL documents/models require review before any licensed-host test."
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - "Source and dependency preflight"
      - "Bundled-content and licensed-host boundary review"
    tests_remaining: []
    limitations:
      - "Testing stopped before install and MCP initialization; no COMSOL result exists."
      - "Re-entry condition: Re-enter after an immutable slim release separates bundled content and initializes before licensed COMSOL qualification."
  creo-mcp:
    category: abandoned
    substatus: closed
    reason: "The three-tool server can execute local CadQuery code but does not prove Creo automation; it also depends on absent CREOSON and Volcengine credentials and lacks gateway evidence."
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
      - "MCP initialization and three-tool discovery"
      - "Local CadQuery STEP export"
      - "Missing CREOSON and invalid-auth diagnostics"
    tests_remaining: []
    limitations:
      - "The exported STEP proves a local fallback, not Creo; arbitrary Python and external knowledge-service dependencies remain."
      - "Re-entry condition: Re-enter after a maintained release performs a bounded Creo operation through CREOSON and Wright with an independently inspected artifact."
  easy-mcp-autocad:
    category: abandoned
    substatus: closed
    reason: The publisher describes this as a learning project with limited maintenance and incomplete tool implementation; its basic AutoCAD scope is already covered by Wright's qualified AutoCAD integration.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
