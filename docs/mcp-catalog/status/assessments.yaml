  freecad-mcp-sergiudanstan:
    category: abandoned
    substatus: closed
    reason: The pinned server initializes and lists 165 tools, but its advertised Linux headless path ignores FREECAD_CMD and tries to spawn a hard-coded macOS Python path; the first modeling call fails before FreeCAD despite FreeCAD 1.0 being installed.
    reviewed_at: "2026-09-10"
    priority: low
    tests_completed:
