    tests_remaining: []
    limitations:
      - The dependency audit reported four high, three moderate, and one low vulnerability.
      - Rediscover only after a release fixes non-macOS headless startup and passes an exported-artifact qualification.
  fusion360-mcp-server:
    category: requires_login
    substatus: authentication_needed
    reason: "The maintained package passes its suite, protocol discovery, mock operations, and the missing-add-in diagnostic; licensed Fusion plus its desktop add-in is the sole unavailable execution boundary."
    reviewed_at: "2026-09-10"
    priority: high
    tests_completed:
