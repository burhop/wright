name: OCI pull-request validation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/docker-build.yml
      - .github/workflows/docker-pr.yml
      - docker/**
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-smoke-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local amd64 validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: wright:pr-${{ github.sha }}
          build-args: |
            VERSION=pr
            REVISION=${{ github.sha }}
            CREATED=1970-01-01T00:00:00Z
      - name: Smoke local image without rebuilding
        run: WRIGHT_DOCKER_IMAGE="wright:pr-${GITHUB_SHA}" WRIGHT_DOCKER_SKIP_BUILD=1 scripts/docker-smoke-test.sh
      - name: Scan local image with blocking policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wright:pr-${{ github.sha }}
          format: json
          output: trivy.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Enforce release vulnerability policy
        run: python -c "from pathlib import Path; from scripts.release.vulnerability_policy import evaluate_report; evaluate_report(Path('trivy.json'), Path('docker/release-policy.json'))"
