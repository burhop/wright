name: OCI pull-request validation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/docker-build.yml
      - .github/workflows/docker-pr.yml
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - src/**
      - hermes-plugin-wright/**
      - integrations/rivet/editor/**
      - integrations/rivet/runner/**
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json
      - README.md
      - scripts/release/scan_image.py
      - scripts/release/vulnerability_policy.py
      - scripts/check-dev-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-smoke-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local amd64 validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: wright:pr-${{ github.sha }}
          build-args: |
            VERSION=pr
            REVISION=${{ github.sha }}
            CREATED=1970-01-01T00:00:00Z
      - name: Smoke local image without rebuilding
        run: WRIGHT_DOCKER_IMAGE="wright:pr-${GITHUB_SHA}" WRIGHT_DOCKER_SKIP_BUILD=1 scripts/docker-smoke-test.sh
      - name: Scan local image with blocking policy
        id: scan
        run: python -m scripts.release.scan_image --image "wright:pr-${GITHUB_SHA}" --output test-results/docker-image-security/ci
      - name: Retain image scan identity and findings
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-vulnerability-policy
          path: test-results/docker-image-security/ci/public
          if-no-files-found: error
