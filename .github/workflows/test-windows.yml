name: test-windows

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Manual trigger for ad-hoc testing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    name: Backend Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Attach PR merge to governed feature branch
        if: github.event_name == 'pull_request'
        env:
          WRIGHT_PR_HEAD_REF: ${{ github.head_ref }}
        run: git switch --force-create "$env:WRIGHT_PR_HEAD_REF" "$env:GITHUB_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
      - name: Install locked interface compiler dependencies
        run: npm ci
      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Verify fixed interface compiler readiness
        run: >-
          uv run python -c "from pathlib import Path; import shutil; from workspace_service.process_interfaces.build import BuildToolchain; root=Path.cwd(); BuildToolchain(Path(shutil.which('node') or ''), root, root / 'packages/process_client', root / 'packages/ui_kit').describe()"
      - name: Configure Git for tests
        run: |
          git config --global user.email "test-ci@example.com"
          git config --global user.name "CI Test Runner"

      - name: Check cross-platform harness and gate boundaries
        run: >-
          uv run --extra runtime --extra engineering-models python -m pytest -q
          tests/release/test_dev_push_process.py
          tests/unit/test_synthetic_beta_agent.py
          tests/unit/test_synthetic_beta_cli.py
          tests/unit/test_synthetic_beta_dashboard.py
          tests/unit/test_synthetic_beta_guest.py
          tests/unit/test_synthetic_beta_reports.py
          tests/unit/test_synthetic_beta_vm.py

      - name: Run pytest
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --extra runtime python -m pytest -q tests/program_control_plane
          uv run python -m pytest -q tests/native_runtime
          $pythonSuites = @(
            'apps/api/tests',
            'packages/agent_adapters/tests',
            'packages/core/tests',
            'packages/data_vault/tests',
            'packages/model_registry/tests',
            'packages/tool_registry/tests',
            'packages/workspace_service/tests'
          )
          foreach ($suite in $pythonSuites) {
            $suiteArgs = if ($suite -eq 'packages/model_registry/tests') {
              @('-m', 'not performance')
            } else {
              @()
            }
            uv run --extra runtime --extra engineering-models python -m pytest -q $suite @suiteArgs
          }
          uv run --extra runtime --extra engineering-models python -m pytest -q tests `
            --ignore=tests/program_control_plane `
            --ignore=tests/native_runtime

  frontend-tests:
    name: Frontend Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check loaded run history before the full frontend suite
        run: >-
          npm run test --workspace=apps/web -- --run
          src/prototypes/workflow-recovery/WorkflowRunHistory.spec.tsx --maxWorkers=1

      - name: Run Vitest
        run: npm run test --workspace=apps/web
