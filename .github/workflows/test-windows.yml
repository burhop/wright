name: test-windows

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Manual trigger for ad-hoc testing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    name: Backend Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Configure Git for tests
        run: |
          git config --global user.email "test-ci@example.com"
          git config --global user.name "CI Test Runner"

      - name: Run pytest
        run: |
          uv run --extra runtime python -m pytest -q tests/program_control_plane
          uv run python -m pytest -q tests/native_runtime
          $pythonSuites = @(
            'apps/api/tests',
            'packages/agent_adapters/tests',
            'packages/core/tests',
            'packages/data_vault/tests',
            'packages/model_registry/tests',
            'packages/tool_registry/tests',
            'packages/workspace_service/tests',
            'tests'
          )
          foreach ($suite in $pythonSuites) {
            uv run --extra runtime --extra engineering-models python -m pytest -q $suite
          }

  frontend-tests:
    name: Frontend Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test --workspace=apps/web
