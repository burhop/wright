name: native Hermes candidate

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-native-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the reviewed native Python subject once
        run: |
          python -m pip install build
          python scripts/build-native-runtime.py \
            --output dist/native-candidate \
            --evidence dist/native-candidate-evidence.json
          wheel=$(find dist/native-candidate -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/build-native-predecessor-fixture.py \
            --wheel "$wheel" \
            --output dist/native-predecessor
      - name: Upload immutable candidate and build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-hermes-candidate
          path: |
            dist/native-candidate
            dist/native-predecessor
            dist/native-candidate-evidence.json
          if-no-files-found: error

  native-base-platform-matrix:
    needs: build-native-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-14
            python: "3.13"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-hermes-candidate
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare released Hermes and the platform-local dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install psutil "hermes-agent==0.19.0"
          python - <<'PY'
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist/native-candidate").glob("*.whl"))
          wheelhouse = pathlib.Path("dist/platform-wheelhouse")
          wheelhouse.mkdir()
          subprocess.check_call([
              sys.executable, "-m", "pip", "download", "--only-binary=:all:",
              "--dest", str(wheelhouse),
              f"wright-engineering[runtime] @ {wheel.resolve().as_uri()}",
          ])
          PY
      - name: Prove real Hermes native runtime lifecycle and post-adapter isolation
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist/native-candidate -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/test-native-hermes-install.py \
            --wheel "$wheel" \
            --wheelhouse dist/platform-wheelhouse \
            --hermes-home "$RUNNER_TEMP/hermes-native-candidate" \
            --plugin-source hermes-plugin-wright \
            --evidence "dist/native-runtime-smoke-${RUNNER_OS}.json" \
            --runtime-smoke
      - name: Upload platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime-smoke-${{ runner.os }}-${{ runner.arch }}
          path: dist/native-runtime-smoke-*.json
          if-no-files-found: error

  native-lifecycle-contract:
    needs: build-native-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.26"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-hermes-candidate
          path: dist
      - name: Run native lifecycle, failure, preservation, and policy contracts
        run: uv run --isolated --all-packages --all-groups python -m pytest -q tests/native_runtime tests/release/test_native_release_evidence.py tests/release/test_native_workflow_policy.py
      - name: Prove first-release update and rollback with two immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install psutil "hermes-agent==0.19.0" "mcp>=1.27.2,<2"
          npm install --global "@openai/codex@0.144.1"
          candidate=$(find dist/native-candidate -maxdepth 1 -name '*.whl' -print -quit)
          predecessor=$(find dist/native-predecessor -maxdepth 1 -name '*.whl' -print -quit)
          python - <<'PY'
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist/native-candidate").glob("*.whl"))
          wheelhouse = pathlib.Path("dist/lifecycle-wheelhouse")
          wheelhouse.mkdir()
          subprocess.check_call([
              sys.executable, "-m", "pip", "download", "--only-binary=:all:",
              "--dest", str(wheelhouse),
              f"wright-engineering[runtime] @ {wheel.resolve().as_uri()}",
          ])
          PY
          python scripts/test-native-hermes-install.py \
            --wheel "$candidate" \
            --previous-wheel "$predecessor" \
            --wheelhouse dist/lifecycle-wheelhouse \
            --hermes-home "$RUNNER_TEMP/hermes-native-lifecycle" \
            --wright-home "$RUNNER_TEMP/wright-native-lifecycle" \
            --plugin-source hermes-plugin-wright \
            --evidence dist/native-lifecycle.json

  native-candidate-required:
    if: ${{ always() }}
    needs:
      - build-native-candidate
      - native-base-platform-matrix
      - native-lifecycle-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require every native candidate dependency
        env:
          BUILD: ${{ needs.build-native-candidate.result }}
          MATRIX: ${{ needs.native-base-platform-matrix.result }}
          LIFECYCLE: ${{ needs.native-lifecycle-contract.result }}
        run: test "$BUILD" = success && test "$MATRIX" = success && test "$LIFECYCLE" = success
