name: Standalone Wright
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel from source distribution
        run: python .github/test_distribution.py --build
      - uses: actions/upload-artifact@v4
        with:
          name: wright-workflow
          path: dist/
          if-no-files-found: error
  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wright-workflow
          path: dist
      - run: python -m pip install pytest
      - name: Install and exercise the artifacts outside the checkout
        run: python .github/test_distribution.py
