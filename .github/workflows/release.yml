name: unified release train

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to rehearse (must match root metadata)
        required: true
        default: v0.1.5
        type: string

env:
  DOCKERHUB_IMAGE: burhop/wright

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-and-python-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      rehearsal: ${{ steps.version.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.26"
      - name: Resolve and validate release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REHEARSAL=false
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            TAG="${{ inputs.tag }}"
            REHEARSAL=true
          fi
          VERSION="${TAG#v}"
          uv run python scripts/release-preflight.py --dry-run --tag "$TAG" --source-commit "$GITHUB_SHA" --output release-evidence.json
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "rehearsal=$REHEARSAL"
            [[ "$VERSION" =~ -(alpha|beta|rc)\. ]] && echo "prerelease=true" || echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"
      - name: Build and validate wheel and sdist once
        run: |
          python -m pip install build twine check-wheel-contents
          scripts/build-python-distributions.sh --dist-root dist/build-once .
          mkdir -p dist/candidate
          find dist/build-once -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/candidate/ \;
          find dist/build-once -type f -name 'native-build-evidence.json' -exec cp {} dist/candidate/native-build-evidence.json \;
          python -m twine check --strict dist/candidate/*.whl dist/candidate/*.tar.gz
          check-wheel-contents dist/candidate/*.whl
          (cd dist/candidate && sha256sum * > SHA256SUMS)
      - name: Upload immutable Python candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-candidate
          path: dist/candidate
          if-no-files-found: error

  python-install-matrix:
    needs: preflight-and-python-build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-candidate
          path: dist
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Independently install and smoke wheel
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python -m venv wheel-venv
          wheel-venv/bin/pip install --no-deps dist/*.whl
          (cd /tmp && "$GITHUB_WORKSPACE/wheel-venv/bin/wright" --version && "$GITHUB_WORKSPACE/wheel-venv/bin/wright" doctor)
      - name: Independently install and smoke sdist
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/pip install --no-deps dist/*.tar.gz
          (cd /tmp && "$GITHUB_WORKSPACE/sdist-venv/bin/wright" --version && "$GITHUB_WORKSPACE/sdist-venv/bin/wright" doctor)

  oci-candidate:
    needs: preflight-and-python-build
    uses: ./.github/workflows/docker-build.yml
    with:
      version: ${{ needs.preflight-and-python-build.outputs.version }}
      push-candidate: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets: inherit

  verify-python-candidate:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, python-install-matrix, oci-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the build-once candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-candidate
          path: dist
      - name: Verify package identity and recorded hashes
        shell: bash
        env:
          VERSION: ${{ needs.preflight-and-python-build.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = 1
          (cd dist && sha256sum --check SHA256SUMS)
          python - <<'PY'
          import os, pathlib, re
          files = [p.name for p in pathlib.Path("dist").iterdir() if p.suffix == ".whl" or p.name.endswith(".tar.gz")]
          expected = os.environ["VERSION"].replace("-alpha.", "a").replace("-beta.", "b").replace("-rc.", "rc")
          if not all(re.search(rf"wright[_-]engineering-{re.escape(expected)}", name) for name in files):
              raise SystemExit(f"candidate filenames do not match version {expected}: {files}")
          PY
      - name: Re-upload verified immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-candidate
          path: dist
          if-no-files-found: error

  publish-testpypi:
    needs: verify-python-candidate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wright-engineering
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-candidate
          path: dist
      - name: Verify hashes and stage only distributions
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
          test "$(find publish-dist -maxdepth 1 -type f | wc -l)" = 2
      - name: Publish exact files to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-dist
          skip-existing: true

  verify-testpypi:
    needs: [preflight-and-python-build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install and smoke TestPyPI subject
        run: |
          python -m pip install --index-url https://test.pypi.org/simple/ --no-deps "wright-engineering==${{ needs.preflight-and-python-build.outputs.version }}"
          wright --version
          wright doctor

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wright-engineering
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-candidate
          path: dist
      - name: Verify hashes and stage only distributions
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
          test "$(find publish-dist -maxdepth 1 -type f | wc -l)" = 2
      - name: Publish the same files to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: publish-dist
          skip-existing: true

  verify-pypi:
    needs: [preflight-and-python-build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install and smoke PyPI subject
        run: |
          python -m pip install --no-deps "wright-engineering==${{ needs.preflight-and-python-build.outputs.version }}"
          wright --version
          wright doctor

  verify-released-hermes-capability:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HERMES_PACKAGE_PLUGIN_VERSION: ${{ vars.HERMES_PACKAGE_PLUGIN_VERSION }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Require the recorded released Hermes package-plugin version
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HERMES_PACKAGE_PLUGIN_VERSION" || {
            echo "::error::No released Hermes version with python-distribution-v1 is recorded."
            exit 1
          }
          python -m pip install "hermes-agent==$HERMES_PACKAGE_PLUGIN_VERSION"
          python -c "from scripts.release.hermes_capability import require_released_package_capability; print(require_released_package_capability())"

  activate-stable-hermes-channel:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, verify-pypi, verify-released-hermes-capability]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-candidate
          path: dist
      - name: Activate the exact immutable version on the stable Hermes channel
        env:
          HERMES_PACKAGE_CHANNEL_URL: ${{ vars.HERMES_PACKAGE_CHANNEL_URL }}
          HERMES_PACKAGE_CHANNEL_TOKEN: ${{ secrets.HERMES_PACKAGE_CHANNEL_TOKEN }}
        run: |
          python scripts/activate-hermes-package-channel.py \
            --channel stable \
            --distribution wright-engineering \
            --version "${{ needs.preflight-and-python-build.outputs.version }}" \
            --wheel dist/*.whl \
            --output hermes-channel-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-hermes-channel-evidence
          path: hermes-channel-evidence.json
          if-no-files-found: error

  promote-oci:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, oci-candidate, verify-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested digest without rebuilding
        env:
          IMAGE: ${{ needs.oci-candidate.outputs.image }}
          DIGEST: ${{ needs.oci-candidate.outputs.digest }}
          TAG: ${{ needs.preflight-and-python-build.outputs.tag }}
          PRERELEASE: ${{ needs.preflight-and-python-build.outputs.prerelease }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG" | grep -F "$DIGEST"
          if [[ "$PRERELEASE" != true ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          fi

  mirror-dockerhub:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, oci-candidate, promote-oci]
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Require Docker Hub release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is required for every production release."
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is required for every production release."
            exit 1
          }
          [[ "$DOCKERHUB_TOKEN" =~ ^dckr_pat_[A-Za-z0-9_-]+$ ]] || {
            echo "::error::DOCKERHUB_TOKEN must contain the raw one-time dckr_pat_ value, without quotes, whitespace, or the token display name."
            exit 1
          }
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Copy and verify the same manifest in Docker Hub
        env:
          SOURCE: ${{ needs.oci-candidate.outputs.image }}@${{ needs.oci-candidate.outputs.digest }}
          DEST_VERSION: ${{ env.DOCKERHUB_IMAGE }}:${{ needs.preflight-and-python-build.outputs.tag }}
          DEST_LATEST: ${{ env.DOCKERHUB_IMAGE }}:latest
          DIGEST: ${{ needs.oci-candidate.outputs.digest }}
          PRERELEASE: ${{ needs.preflight-and-python-build.outputs.prerelease }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$DEST_VERSION" "$SOURCE"
          docker buildx imagetools inspect "$DEST_VERSION" | grep -F "$DIGEST"
          if [[ "$PRERELEASE" != true ]]; then
            docker buildx imagetools create --tag "$DEST_LATEST" "$SOURCE"
            docker buildx imagetools inspect "$DEST_LATEST" | grep -F "$DIGEST"
          fi

  native-published-lifecycle:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs:
      - preflight-and-python-build
      - activate-stable-hermes-channel
      - verify-released-hermes-capability
      - mirror-dockerhub
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      HERMES_PACKAGE_PLUGIN_VERSION: ${{ vars.HERMES_PACKAGE_PLUGIN_VERSION }}
      PREVIOUS_NATIVE_WRIGHT_VERSION: ${{ vars.PREVIOUS_NATIVE_WRIGHT_VERSION }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install released Hermes and verify the published native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HERMES_PACKAGE_PLUGIN_VERSION"
          test -n "$PREVIOUS_NATIVE_WRIGHT_VERSION"
          python -m pip install psutil "hermes-agent==$HERMES_PACKAGE_PLUGIN_VERSION"
          python scripts/test-published-native-hermes.py \
            --version "${{ needs.preflight-and-python-build.outputs.version }}" \
            --previous-version "$PREVIOUS_NATIVE_WRIGHT_VERSION" \
            --evidence "native-published-${RUNNER_OS}-${RUNNER_ARCH}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-published-${{ runner.os }}-${{ runner.arch }}
          path: native-published-*.json
          if-no-files-found: error

  rehearsal:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal == 'true' }}
    needs: [preflight-and-python-build, python-install-matrix, oci-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.26"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-candidate
          path: dist
      - name: Prove terminal dry-run with no public mutation
        run: |
          uv run python scripts/release-rehearsal.py \
            --dry-run \
            --tag "${{ needs.preflight-and-python-build.outputs.tag }}" \
            --python-dist dist \
            --native-build-evidence dist/native-build-evidence.json \
            --output rehearsal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-evidence
          path: rehearsal

  post-publish-verification:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, oci-candidate, verify-pypi, promote-oci, mirror-dockerhub, native-published-lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-candidate
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-hermes-channel-evidence
          path: native-evidence/channel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-published-*
          path: native-evidence/platforms
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify canonical immutable digest and package
        run: |
          docker buildx imagetools inspect "${{ needs.oci-candidate.outputs.image }}@${{ needs.oci-candidate.outputs.digest }}"
          python -m pip install --no-deps "wright-engineering==${{ needs.preflight-and-python-build.outputs.version }}"
          wright --version
      - name: Independently verify required public Docker Hub tags
        env:
          TAG: ${{ needs.preflight-and-python-build.outputs.tag }}
          DIGEST: ${{ needs.oci-candidate.outputs.digest }}
          PRERELEASE: ${{ needs.preflight-and-python-build.outputs.prerelease }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$TAG" | grep -F "$DIGEST"
          if [[ "$PRERELEASE" != true ]]; then
            docker buildx imagetools inspect "$DOCKERHUB_IMAGE:latest" | grep -F "$DIGEST"
          fi
      - name: Assemble exact-subject release evidence
        run: |
          python scripts/assemble-release-evidence.py \
            --mode release \
            --tag "${{ needs.preflight-and-python-build.outputs.tag }}" \
            --source-commit "${{ github.sha }}" \
            --python-dist dist \
            --oci-repository "${{ needs.oci-candidate.outputs.image }}" \
            --oci-digest "${{ needs.oci-candidate.outputs.digest }}" \
            --promotion-destination "${{ needs.oci-candidate.outputs.image }}" \
            --promotion-destination "docker.io/${{ env.DOCKERHUB_IMAGE }}" \
            --approval testpypi \
            --approval pypi \
            --approval release \
            --approval dockerhub \
            --native-build-evidence dist/native-build-evidence.json \
            --native-lifecycle-evidence native-evidence/platforms/native-published-Linux-X64.json \
            --native-lifecycle-evidence native-evidence/platforms/native-published-Windows-X64.json \
            --native-lifecycle-evidence native-evidence/platforms/native-published-macOS-ARM64.json \
            --hermes-version "${{ vars.HERMES_PACKAGE_PLUGIN_VERSION }}" \
            --hermes-install-interface "hermes plugins install-package" \
            --hermes-capability-source released \
            --stable-hermes-channel stable \
            --stable-hermes-verification-url "${{ vars.HERMES_PACKAGE_CHANNEL_URL }}" \
            --native-public-verification native-evidence/platforms/native-published-Linux-X64.json \
            --output final-evidence/release-evidence.json
          python scripts/verify-release-evidence.py final-evidence/release-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-release-evidence
          path: final-evidence
          if-no-files-found: error

  deploy-versioned-docs:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, post-publish-verification]
    uses: ./.github/workflows/docs-deploy.yml
    with:
      deploy: true
    permissions:
      contents: write

  publish-github-release-last:
    if: ${{ needs.preflight-and-python-build.outputs.rehearsal != 'true' }}
    needs: [preflight-and-python-build, post-publish-verification, native-published-lifecycle, mirror-dockerhub, deploy-versioned-docs]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-release-evidence
          path: final-evidence
      - name: Publish GitHub Release only after every verification
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          tag_name: ${{ needs.preflight-and-python-build.outputs.tag }}
          draft: false
          prerelease: ${{ needs.preflight-and-python-build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: final-evidence/release-evidence.json
