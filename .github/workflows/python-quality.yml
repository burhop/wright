name: python-quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Lint with Ruff
        run: uv run ruff check apps/api packages/core packages/agent_adapters packages/tool_registry packages/data_vault packages/workspace_service

      - name: Check Formatting with Ruff
        run: uv run ruff format --check apps/api packages/core packages/agent_adapters packages/tool_registry packages/data_vault packages/workspace_service

      - name: Lint and package-test optional Hermes integration
        run: |
          uv run ruff check hermes-plugin-wright
          uv run --package hermes-plugin-wright --with PyYAML python -m pytest hermes-plugin-wright/tests
          uv build --package hermes-plugin-wright --wheel --out-dir dist/private-package-check

      - name: Type Check with mypy
        run: |
          uv pip install mypy
          uv run mypy scripts/release src/wright_engineering --ignore-missing-imports
          uv run mypy apps/api packages/core packages/agent_adapters packages/tool_registry packages/data_vault packages/workspace_service --ignore-missing-imports || echo "::warning::Mypy type checks failed with warning mode enabled."

      - name: Validate Python package distributions
        run: scripts/build-python-distributions.sh --dry-run packages/core packages/tool_registry

      - name: Configure Git for tests
        run: |
          git config --global user.email "test-ci@example.com"
          git config --global user.name "CI Test Runner"

      - name: Run Tests with pytest
        run: |
          uv run python -m pytest -q tests/native_runtime tests/release/test_native_workflow_policy.py
          for python_suite in \
            apps/api/tests \
            packages/agent_adapters/tests \
            packages/core/tests \
            packages/data_vault/tests \
            packages/model_registry/tests \
            packages/tool_registry/tests \
            packages/workspace_service/tests \
            tests; do
            uv run --extra runtime --extra engineering-models python -m pytest -q "$python_suite"
          done

      - name: Enforce ratcheted release-code coverage
        run: uv run --with pytest-cov python -m pytest -q tests/release tests/native_runtime --cov=scripts.release --cov=wright_engineering --cov-report=term --cov-fail-under=85

  public-package-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build complete native artifact for this isolated matrix job
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir dist
          python -c "from pathlib import Path; from scripts.release.python_artifacts import validate_native_distribution; [validate_native_distribution(p) for p in Path('dist').iterdir() if p.suffix == '.whl' or p.name.endswith('.tar.gz')]"
      - name: Independently install and smoke wheel and sdist
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile, venv
          artifacts = [*pathlib.Path("dist").glob("*.whl"), *pathlib.Path("dist").glob("*.tar.gz")]
          if len(artifacts) != 2:
              raise SystemExit(f"expected wheel and sdist, found {artifacts}")
          for artifact in artifacts:
              with tempfile.TemporaryDirectory() as value:
                  root = pathlib.Path(value)
                  venv.EnvBuilder(with_pip=True).create(root)
                  python = root / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
                  subprocess.check_call([python, "-m", "pip", "install", "--no-deps", artifact.resolve()])
                  subprocess.check_call([python, "-c", "from wright_engineering.cli import main; raise SystemExit(main(['doctor']))"], cwd=root)
          PY
