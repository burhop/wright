name: MCP catalog validation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/mcp-catalog.yml
      - docker/mcp-bundle*.yaml
      - docker/mcp-bundle.schema.json
      - docker/mcp/verify-bundle.py
      - docs/mcp-catalog/**
      - docs/mcp-status/**
      - scripts/engineering_mcp_status.py
      - scripts/generate-engineering-mcp-status.py
      - scripts/engineering-mcp-dashboard.html
      - scripts/verify-engineering-mcp-dashboard.mjs
      - packages/tool_registry/src/tool_registry/catalog/**
      - packages/tool_registry/src/tool_registry/canonical_catalog.py
      - packages/tool_registry/src/tool_registry/catalog_bundle.py
      - packages/tool_registry/src/tool_registry/catalog_models.py
      - packages/tool_registry/src/tool_registry/curation_models.py
      - packages/tool_registry/src/tool_registry/catalog_curation.py
      - packages/tool_registry/src/tool_registry/catalog_platforms.py
      - packages/tool_registry/tests/test_catalog_*.py
      - packages/tool_registry/tests/test_engineering_mcp_status.py
      - tests/docker/test_mcp_bundle.py
      - pyproject.toml
      - uv.lock
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/mcp-catalog.yml
      - docker/mcp-bundle*.yaml
      - docker/mcp-bundle.schema.json
      - docker/mcp/verify-bundle.py
      - docs/mcp-catalog/**
      - docs/mcp-status/**
      - scripts/engineering_mcp_status.py
      - scripts/generate-engineering-mcp-status.py
      - scripts/engineering-mcp-dashboard.html
      - scripts/verify-engineering-mcp-dashboard.mjs
      - packages/tool_registry/src/tool_registry/catalog/**
      - packages/tool_registry/src/tool_registry/canonical_catalog.py
      - packages/tool_registry/src/tool_registry/catalog_bundle.py
      - packages/tool_registry/src/tool_registry/catalog_models.py
      - packages/tool_registry/src/tool_registry/curation_models.py
      - packages/tool_registry/src/tool_registry/catalog_curation.py
      - packages/tool_registry/src/tool_registry/catalog_platforms.py
      - packages/tool_registry/tests/test_catalog_*.py
      - packages/tool_registry/tests/test_engineering_mcp_status.py
      - tests/docker/test_mcp_bundle.py
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Validate catalog and platform bundles
        run: |
          uv run pytest \
            packages/tool_registry/tests/test_catalog_resource.py \
            packages/tool_registry/tests/test_engineering_catalog.py \
            packages/tool_registry/tests/test_catalog_platforms.py \
            packages/tool_registry/tests/test_catalog_distribution.py \
            packages/tool_registry/tests/test_catalog_curation.py \
            packages/tool_registry/tests/test_engineering_mcp_status.py \
            tests/docker/test_mcp_bundle.py
          uv run python docker/mcp/verify-bundle.py docker/mcp-bundle.yaml
          uv run python docker/mcp/verify-bundle.py docker/mcp-bundle.linux-arm64.yaml
          uv run python docker/mcp/verify-bundle.py docker/mcp-bundle.windows-amd64.yaml

      - name: Report review decisions and lifecycle gaps
        run: uv run python -m tool_registry.catalog_curation report --output-dir artifacts/mcp-curation

      - name: Validate combined QA and public status projections
        run: |
          uv run python scripts/generate-engineering-mcp-status.py \
            --history docs/mcp-status/history.json \
            --qa-output artifacts/mcp-status-qa \
            --public-output artifacts/mcp-status-public

      - name: Observe public sources and discover lifecycle candidates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          status=0
          uv run python -m tool_registry.catalog_curation research --output-dir artifacts/mcp-curation || status=1
          for query in requirements sourcing manufacturing testing operations; do
            uv run python -m tool_registry.catalog_curation discover --search "$query" --output-dir "artifacts/mcp-curation/discovery-$query" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo '::warning::Some public sources were unavailable. Inspect attempt artifacts; no catalog decisions were changed.'
          fi

      - name: Preserve curation evidence for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-curation-review
          path: artifacts/mcp-curation
          if-no-files-found: warn
          retention-days: 90
