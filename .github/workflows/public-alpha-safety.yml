name: public-alpha-safety

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.26"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run Public Alpha Leak Scan
        run: python scripts/check-public-alpha-leaks.py

      - name: Audit locked Python runtime dependencies with expiring exceptions
        shell: bash
        run: |
          uv run --locked --extra runtime --with pip-audit pip-audit --format json --output pip-audit.json || true
          python -c "from pathlib import Path; from scripts.release.dependency_audit import evaluate_pip_audit; evaluate_pip_audit(Path('pip-audit.json'), Path('.github/dependency-audit-policy.json'))"

      - name: Run npm dependency audit with expiring exceptions
        shell: bash
        run: |
          npm audit --json --audit-level=high > npm-audit.json || true
          python -c "from pathlib import Path; from scripts.release.dependency_audit import evaluate_npm_audit; evaluate_npm_audit(Path('npm-audit.json'), Path('.github/dependency-audit-policy.json'))"

      - name: Run Gitleaks History Scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --no-banner \
            --redact \
            --verbose

      - name: Run TruffleHog History Scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.95.7 \
            git file:///repo \
            --no-update \
            --fail \
            --results=verified,unknown \
            --no-verification \
            --exclude-globs=uv.lock,package-lock.json
