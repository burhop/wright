[project]
name = "wright-engineering"
version = "0.1.9"
description = "Managed manager-neutral application and CLI for the Wright engineering workspace"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Wright Project", email = "wright@makerengineer.com" }]
keywords = ["wright", "engineering", "local-first", "agent", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "packaging>=24,<27",
    "psutil>=6,<8",
]

[project.optional-dependencies]
engineering-models = [
    "numpy>=1.26,<3",
]
runtime = [
    "cryptography>=45,<50",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "structlog>=24.1,<27",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "PyYAML>=6,<7",
    "mcp>=1.27.2,<2",
    "jsonschema>=4.26,<5",
    "python-multipart>=0.0.32,<1",
]
workspace-surfaces-test = [
    "build>=1.2,<2",
    "check-wheel-contents==0.6.3",
    "hatchling>=1.27,<2",
    "jsonschema>=4.26,<5",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/burhop/wright"
Source = "https://github.com/burhop/wright"
Issues = "https://github.com/burhop/wright/issues"
Documentation = "https://burhop.github.io/wright/"
Releases = "https://github.com/burhop/wright/releases"

[project.scripts]
wright = "wright_engineering.cli:main"
wright-rivet-mcp = "workspace_service.rivet_mcp:main"

[tool.uv.sources]
wright-engineering = { workspace = true }
wright-workspace-service = { workspace = true }
wright-model-registry = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api",
    "hermes-plugin-wright",
    "packages/core",
    "packages/agent_adapters",
    "packages/tool_registry",
    "packages/data_vault",
    "packages/model_registry",
    "packages/workspace_service",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/agent_adapters/tests",
    "packages/core/tests",
    "packages/data_vault/tests",
    "packages/model_registry/tests",
    "packages/tool_registry/tests",
    "packages/workspace_service/tests",
    "tests",
]
markers = [
    "external_model: explicit opt-in exact-revision public engineering-model validation under .local-run",
    "gateway: provider-neutral GatewayService contract and isolation tests",
    "mcp_protocol: official MCP SDK transport and protocol compatibility tests",
    "rivet_live_ai: explicit opt-in tests that use the local Hermes/Codex subscription; also requires WRIGHT_RIVET_LIVE_AI=1",
    "rivet_live_brep: explicit opt-in BREP application test; also requires WRIGHT_RIVET_LIVE_BREP=1 and a current workspace-enabled server",
    "rivet_live_host: explicit opt-in Solid Edge or available host-bridge test; also requires WRIGHT_RIVET_LIVE_HOST=1 and an already installed proprietary host",
    "release: exact-artifact release identity, supply-chain, and recovery contracts",
    "workspace_surfaces: Workspace Surfaces contract, lifecycle, security, and presentation tests",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.check-wheel-contents]
# The public runtime is intentionally self-contained and bundles these package
# roots in one wheel; W009 would otherwise reject that reviewed layout.
ignore = ["W009"]

[tool.hatch.build.targets.wheel]
# Hatchling includes non-Python data beneath these package roots. This carries
# `core/surfaces/schemas/**` and `wright_engineering/static/web/**`; the archive
# assertions in tests/packaging/test_wheel_contents.py guard both resource sets.
packages = [
    "src/wright",
    "src/wright_engineering",
    "apps/api/src/api",
    "packages/core/src/core",
    "packages/agent_adapters/src/agent_adapters",
    "packages/tool_registry/src/tool_registry",
    "packages/data_vault/src/data_vault",
    "packages/model_registry/src/model_registry",
    "packages/workspace_service/src/workspace_service",
]

[tool.hatch.build.targets.wheel.force-include]
"integrations/rivet/editor/host.py" = "workspace_service/_rivet/editor/host.py"
"integrations/rivet/editor/manifest.json" = "workspace_service/_rivet/editor/manifest.json"
"integrations/rivet/editor/dist" = "workspace_service/_rivet/editor/dist"
"integrations/rivet/editor/patches" = "workspace_service/_rivet/editor/patches"
"integrations/rivet/editor/wrapper" = "workspace_service/_rivet/editor/wrapper"
"integrations/rivet/runner/manifest.json" = "workspace_service/_rivet/runner/manifest.json"
"integrations/rivet/runner/dist" = "workspace_service/_rivet/runner/dist"
"integrations/rivet/runner/src" = "workspace_service/_rivet/runner/src"

[tool.hatch.build.targets.sdist]
# Rivet's pinned runtime bundles are version-controlled release artifacts. The
# manifests record their exact source revisions and integrity digests so source,
# wheel, and sdist builds remain self-contained in clean environments.
artifacts = [
    "/integrations/rivet/editor/dist",
    "/integrations/rivet/runner/dist",
]
include = [
    "/src/wright",
    "/src/wright_engineering",
    "/apps/api/src/api",
    "/packages/core/src/core",
    "/packages/agent_adapters/src/agent_adapters",
    "/packages/tool_registry/src/tool_registry",
    "/packages/data_vault/src/data_vault",
    "/packages/model_registry/src/model_registry",
    "/packages/workspace_service/src/workspace_service",
    "/integrations/rivet/editor/host.py",
    "/integrations/rivet/editor/manifest.json",
    "/integrations/rivet/editor/dist",
    "/integrations/rivet/editor/patches",
    "/integrations/rivet/editor/wrapper",
    "/integrations/rivet/runner/manifest.json",
    "/integrations/rivet/runner/dist",
    "/integrations/rivet/runner/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.gitignore",
    "/.github",
    "/.specify",
    "/docker",
    "/docs",
    "/hermes-plugin-wright",
    "/scripts",
    "/specs",
    "/tests",
    "/windows-sandbox",
]
