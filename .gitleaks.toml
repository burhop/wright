title = "Wright Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Historical Onshape credential examples in the MCP credential setup spec are placeholders, not live credentials."
condition = "AND"
paths = ['''specs/026-mcp-credential-setup/data-model\.md''']
regexTarget = "secret"
regexes = [
  '''on_dPlLqKAcKfwxInzX8JVqw''',
  '''iG5e4db0lzGzZmIO8oWMhl01nTaDODgAbR8IRhJpOeRFNBce''',
]

[[allowlists]]
description = "Deleted hackathon prototype documentation used a local placeholder bearer token, not a live secret."
condition = "AND"
paths = ['''docs/nous-hackathon-prototype\.md''']
regexTarget = "secret"
regexes = ['''wright-local-dev''']

[[allowlists]]
description = "Workspace Surface contract-set values are public SHA-256 integrity hashes, not credentials."
paths = ['''packages/core/src/core/surfaces/schemas/contract-set\.json''']

[[allowlists]]
description = "Rivet editor index bundles are immutable upstream-generated assets guarded by the editor manifest integrity check; the default scanner matches are minified keyboard-handler identifiers, not credentials."
paths = [
  '''integrations/rivet/editor/dist/assets/index-[A-Za-z0-9_-]+\.js''',
  '''integrations/rivet/runner/artifacts/rivet-node-[0-9.]+\.cjs''',
]

[[allowlists]]
description = "Program-status run keys are deterministic SHA-256 test identities, not credentials."
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''docs/programs/engineering-process-platform/test-run-ledger\.json''',
  '''packages/tool_registry/tests/test_program_status\.py''',
  '''src/wright_engineering/static/program-status/current\.json''',
]
regexTarget = "match"
regexes = ['''run_key"\s*:\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "Independently classified native evidence integrity values; exact path, rule and matched key/value only. Credentials and other hashes remain scanned."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^specs/079-wright-native-authoring/evidence/native-browser-runs-20260904\.json$''']
regexTarget = "match"
regexes = [
  '''^token": "85a7fe4e32f6e87173de0abc9f8e1a06aadc7a3d53a526b32346b29efc9664f9"$''',
