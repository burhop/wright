regexes = ['''^WRIGHT_API_TOKEN": "[0-9a-f]{64}"$''']

[[allowlists]]
description = "Historical EPP transition observation is a SHA-256 response-body digest, not a credential; exact introducing commit, evidence path, rule and key shape only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["80e7e19d53e42c6c01990731d7cc111cef3009d8"]
paths = ['''^docs/programs/engineering-process-platform/evidence/transitions/TR-0091\.json$''']
regexTarget = "match"
regexes = ['''^api_body_sha256:[0-9a-f]{64}"$''']

[[allowlists]]
description = "The fixed JIG03-KEEPOUTS engineering requirement beside JIG03-KEY is not an API key; exact profile, rule and public label only."
