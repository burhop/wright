# =============================================================================
# Wright MCP Appliance Compose Overlay
# =============================================================================
# Usage:
#   docker compose -f docker-compose.mcp.yml up -d --build
#
# This file intentionally uses separate volume names from docker-compose.minimal.yml.
# =============================================================================

services:
  agent:
    image: ${WRIGHT_MCP_IMAGE:-wright:engineering-tools-linux-amd64}
    platform: ${WRIGHT_MCP_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
      args:
        WRIGHT_BASE_IMAGE: ${WRIGHT_BASE_IMAGE:-wright:test}
        WRIGHT_MCP_BUNDLE_FILE: ${WRIGHT_MCP_BUNDLE_FILE:-mcp-bundle.yaml}
        WRIGHT_SOLIDEDGE_MCP_GIT_URL: ${WRIGHT_SOLIDEDGE_MCP_GIT_URL:-https://github.com/burhop/SolidEdgeMCP.git}
        WRIGHT_SOLIDEDGE_MCP_GIT_REF: ${WRIGHT_SOLIDEDGE_MCP_GIT_REF:-2aad5bd24df6ce1ac9578ad35c4da7ac241b5330}
      secrets:
        - github_token
    container_name: ${WRIGHT_MCP_CONTAINER:-wright_agent_mcp}
    env_file:
      - docker/.env
    ports:
      # Default mapping is 127.0.0.1:8080:8000. Set WRIGHT_MCP_BIND=0.0.0.0 only for trusted LAN tests.
      - "${WRIGHT_MCP_BIND:-127.0.0.1}:${WRIGHT_MCP_HOST_PORT:-8080}:8000"
    volumes:
      - wright_mcp_data:/home/agent/.local/share/wright
      - wright_mcp_workspaces:/home/agent/workspace
      - wright_mcp_config:/home/agent/.config/wright
      - wright_mcp_hermes:/home/agent/.hermes
      - wright_mcp_logs:/var/log/
      - ./scripts:/recovery:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/agent/.cache:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - WRIGHT_ENV=production
      - WRIGHT_AUTH_MODE=${WRIGHT_AUTH_MODE:-enforced}
      - WRIGHT_BIND_HOST=${WRIGHT_MCP_BIND:-127.0.0.1}
      - WRIGHT_ALLOWED_ORIGINS=${WRIGHT_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173}
      - WRIGHT_WORKSPACES_DIR=/home/agent/workspace
      - WRIGHT_WORKSPACE_PATH=/home/agent/workspace
      - WRIGHT_MCP_HERMES_CONFIG=/opt/wright/mcp/generated/hermes-mcp.generated.yaml
      - WRIGHT_MCP_STATUS=/opt/wright/mcp/generated/mcp-bundle-status.json
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  wright_mcp_data:
    name: ${WRIGHT_MCP_VOLUME_PREFIX:-wright_mcp}_data
  wright_mcp_workspaces:
    name: ${WRIGHT_MCP_VOLUME_PREFIX:-wright_mcp}_workspaces
  wright_mcp_config:
    name: ${WRIGHT_MCP_VOLUME_PREFIX:-wright_mcp}_config
  wright_mcp_hermes:
    name: ${WRIGHT_MCP_VOLUME_PREFIX:-wright_mcp}_hermes
  wright_mcp_logs:
    name: ${WRIGHT_MCP_VOLUME_PREFIX:-wright_mcp}_logs

secrets:
  github_token:
    environment: GITHUB_TOKEN
